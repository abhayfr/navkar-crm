<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navkar Sterling Silver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e4df;
  --brand:#3a4a5c; --brand-soft:#e9edf2; --ok:#2f7d4f; --ok-soft:#e5f2ea;
  --warn:#a86a12; --warn-soft:#fbf0dc; --bad:#b23b3b; --bad-soft:#f8e4e4;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit}
a{color:var(--brand)}
.hidden{display:none!important}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 16px}
.logo{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:500}
nav a.on{background:var(--brand-soft);color:var(--brand)}
.who{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.who button{margin-top:2px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile .n{font-size:24px;font-weight:700}
.tile .l{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#c9c6bf}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.link{background:none;border:none;color:var(--brand);cursor:pointer;padding:0;font-weight:500}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
tr.click{cursor:pointer} tr.click:hover td{background:#faf9f7}
.tablewrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.grey{background:#eee;color:#666}
.g-A{background:var(--ok-soft);color:var(--ok)} .g-B{background:var(--brand-soft);color:var(--brand)} .g-C{background:var(--warn-soft);color:var(--warn)} .g-D{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .r{text-align:right} .b{font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* order card */
.order{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.order .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order .no{font-weight:700}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.step .t{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.step .p{font-weight:600;font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step select{padding:4px 6px;font-size:13px;margin-top:4px}
.step.done{background:var(--ok-soft);border-color:#cfe6d8}
.step.now{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.step.empty .p{color:var(--bad)}
.order .act{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.facts{font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:760px){
  .steps{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .bar{flex-wrap:wrap} nav{order:3;flex-basis:100%}
}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:520px;padding:20px}
.modal h3{margin:0 0 6px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px}
.auth{max-width:380px;margin:60px auto;padding:0 16px}
.auth .card{padding:24px}
.auth h1{font-size:20px}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;color:var(--ink);font-size:14px}
.chk input{width:auto}
.empty{color:var(--muted);padding:20px;text-align:center}
</style>

<script>

const S = { me:null, staff:[], customers:[], orders:[], payments:[], tasks:[], leads:[], interactions:[], settings:null, outboxCount:0 };
const ROLE_NAMES = { admin:'Admin', accounts:'Accounts', picker:'Picking', checker:'Weight check', packer:'Packing', sales:'Sales' };
const STEPS = [
  { field:'picker',    label:'Pick',          need:'picker',   doneAt:'picked_at',    stages:['received','picking'] },
  { field:'estimator', label:'Estimate',      need:'accounts', doneAt:'estimated_at', stages:['estimate'] },
  { field:'checker',   label:'Weight check',  need:'checker',  doneAt:'checked_at',   stages:['checking'] },
  { field:'biller',    label:'Bill',          need:'accounts', doneAt:'billed_at',    stages:['billing'] },
  { field:'packer',    label:'Pack & ship',   need:'packer',   doneAt:'shipped_at',   stages:['shipping'] },
];
const STAGE_TEXT = { received:'Waiting to be picked', picking:'Waiting to be picked', estimate:'Waiting for estimate', checking:'Waiting for weight check', billing:'Waiting for bill', shipping:'Waiting to pack & ship', done:'Shipped', cancelled:'Cancelled' };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupees = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
const grams = g => { g = Number(g)||0; return g >= 1000 ? (g/1000).toLocaleString('en-IN',{maximumFractionDigits:2})+' kg' : g.toLocaleString('en-IN',{maximumFractionDigits:1})+' g'; };
const today = () => new Date().toISOString().slice(0,10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const fmtDate = d => d ? new Date(d + (d.length===10?'T00:00:00':'')).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const isAdmin = () => S.me?.roles?.includes('admin');
const hasRole = r => isAdmin() || S.me?.roles?.includes(r);
const staffName = id => S.staff.find(s => s.id === id)?.name || '';
const custName = id => S.customers.find(c => c.id === id)?.name || '—';
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function friendly(e){ const m = (e && (e.message || e.error_description || e.error)) || String(e); return m.replace(/^.*?ERROR:\s*/,''); }

function slabOf(stores){ stores = Number(stores)||1; return stores <= 1 ? '1' : stores <= 10 ? '2-10' : stores <= 25 ? '11-25' : '26+'; }
const SLAB_LABEL = { '1':'Single store', '2-10':'2–10 stores', '11-25':'11–25 stores', '26+':'25+ stores' };

function stageOwner(o){
  if (['received','picking'].includes(o.stage)) return o.picker;
  return { estimate:o.estimator, checking:o.checker, billing:o.biller, shipping:o.packer }[o.stage] || null;
}
function stepIndex(o){ if (o.stage==='done') return 5; if (o.stage==='cancelled') return -1; return STEPS.findIndex(s => s.stages.includes(o.stage)); }

// ---------- data ----------
async function fetchAll(table, cols='*', order){
  const out = []; const step = 1000;
  for (let from = 0; ; from += step){
    let q = sb.from(table).select(cols).range(from, from + step - 1);
    if (order) q = q.order(order);
    const { data, error } = await q; if (error) throw error;
    out.push(...data); if (data.length < step) break;
  }
  return out;
}
async function loadAll(){
  const q = t => sb.from(t).select('*');
  const [st, cu, or, pa, ta, le, inx, se] = await Promise.all([
    q('staff').order('name'), fetchAll('customers','*','name'), q('orders').order('created_at',{ascending:false}),
    q('payments').order('paid_on'), q('tasks').order('created_at',{ascending:false}),
    fetchAll('leads','*','name'), q('interactions').order('happened_on',{ascending:false}), q('settings').single()
  ]);
  for (const r of [st,or,pa,ta,inx,se]) if (r.error) throw r.error;
  S.staff = st.data; S.customers = cu; S.orders = or.data; S.payments = pa.data; S.tasks = ta.data;
  S.leads = le; S.interactions = inx.data; S.settings = se.data;
  S.me = S.staff.find(s => s.id === S.uid) || null;
  // Tally copy
  const [tc, ts, tr, trc, to, ti] = await Promise.all([
    fetchAll('tally_customers','key,name,balance_receivable,opening_receivable'),
    fetchAll('tally_sales','key,date,voucher_number,party,amount,weight_g,taxable_value','date'),
    fetchAll('tally_returns','key,date,voucher_number,party,amount,weight_g,reference','date'),
    fetchAll('tally_receipts','key,date,voucher_number,party,amount','date'),
    fetchAll('tally_outstanding','key,party,bill_ref,bill_date,amount_due','bill_date'),
    sb.from('tally_imports').select('*').order('imported_at',{ascending:false}).limit(50)
  ]);
  const imps = ti.data || [];
  const upto = imps.map(x=>x.data_upto).filter(Boolean).sort().pop() || null;
  S.tally = { cust:Object.fromEntries(tc.map(x=>[x.name,x])), import: upto ? { data_upto: upto } : null, lastSeen: imps[0]?.imported_at || null, by:{} };
  const by = S.tally.by, slot = p => by[p] || (by[p] = { sales:[], returns:[], receipts:[], open:[] });
  ts.forEach(x => slot(x.party).sales.push(x)); tr.forEach(x => slot(x.party).returns.push(x));
  trc.forEach(x => slot(x.party).receipts.push(x)); to.forEach(x => slot(x.party).open.push(x));
  if (isAdmin()) {
    const { count } = await sb.from('whatsapp_outbox').select('id',{count:'exact',head:true}).eq('status','queued');
    S.outboxCount = count || 0;
  }
}
const tallyUpto = () => S.tally?.import?.data_upto || null;
const creditDays = c => c.credit_days ?? S.settings?.credit_days ?? 45;
const addDays = (d, n) => { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };

// every bill for a customer: Tally sales + bills entered in this app that aren't in Tally yet
function billsOf(c){
  const t = c.tally_name && S.tally.by[c.tally_name];
  const tb = t ? t.sales.map(s => ({ date:s.date, no:s.voucher_number, g:Number(s.weight_g)||0, amt:Number(s.amount)||0, taxable:Number(s.taxable_value)||0, due:addDays(s.date, creditDays(c)), src:'tally' })) : [];
  const known = new Set(tb.map(b => String(b.no).trim().toLowerCase()));
  const ab = S.orders.filter(o => o.customer_id===c.id && o.bill_amount!=null && o.stage!=='cancelled' && !known.has(String(o.bill_no||'').trim().toLowerCase()))
    .map(o => ({ date:o.bill_date, no:o.bill_no, g:Number(o.bill_g)||0, amt:Number(o.bill_amount)||0, taxable:0, due:o.due_date, src:'app' }));
  return tb.concat(ab).sort((a,b) => (a.date||'').localeCompare(b.date||''));
}
// grading + collections
function customerStats(c){
  const bills = billsOf(c);
  const t = c.tally_name && S.tally.by[c.tally_name], tc = c.tally_name && S.tally.cust[c.tally_name];
  const upto = tallyUpto();
  const pays = S.payments.filter(p => p.customer_id===c.id);
  let outstanding = 0, overdue = 0, oldestDue = null;
  if (tc) {
    const newPays = pays.filter(p => !upto || p.paid_on > upto).reduce((s,p)=>s+Number(p.amount),0);
    const newBills = bills.filter(b => b.src==='app').reduce((s,b)=>s+b.amt,0);
    outstanding = Math.max(0, Number(tc.balance_receivable||0) + newBills - newPays);
    let od = 0;
    if (t?.open?.length) { // Tally tracks this customer bill-by-bill
      for (const o of t.open) { const due = addDays(o.bill_date, creditDays(c)); if (due < today()) { od += Number(o.amount_due); if (!oldestDue || due < oldestDue) oldestDue = due; } }
    } else { // estimate: what's owed sits on the newest bills; anything beyond them is overdue
      let left = outstanding;
      for (const b of [...bills].reverse()) {
        if (left <= 0.5) break;
        const part = Math.min(left, b.amt); left -= part;
        if (b.due && b.due < today()) { od += part; oldestDue = b.due; }
      }
      if (left > 0.5) { od += left; oldestDue = oldestDue || '2026-04-01'; } // older than this year's bills
    }
    overdue = Math.max(0, Math.min(outstanding, od - (t?.open?.length ? newPays : 0)));
    if (!overdue) oldestDue = null;
  } else {
    let left = pays.reduce((s,p) => s + Number(p.amount), 0);
    for (const b of bills){
      const covered = Math.min(left, b.amt); left -= covered; const open = b.amt - covered;
      if (open > 0.5){ outstanding += open; if (b.due && b.due < today()){ overdue += open; if(!oldestDue) oldestDue = b.due; } }
    }
  }
  const from = daysAgo(90);
  const retG = (t?.returns||[]).filter(r => r.date >= from).reduce((s,r)=>s+(Number(r.weight_g)||0),0);
  const qGrams = Math.max(0, bills.filter(b => (b.date||'') >= from).reduce((s,b) => s + b.g, 0) - retG);
  const slab = slabOf(c.stores);
  const targetKg = Number(S.settings?.slab_targets?.[slab]) || 0;
  const pct = targetKg ? (qGrams/1000)/targetKg*100 : 0;
  const cuts = S.settings?.grade_cuts || {A:100,B:60,C:25};
  const grade = !bills.length ? '—' : pct >= cuts.A ? 'A' : pct >= cuts.B ? 'B' : pct >= cuts.C ? 'C' : 'D';
  const lastBill = bills.length ? bills[bills.length-1].date : null;
  return { bills, pays, outstanding, overdue, oldestDue, qGrams, targetKg, pct, grade, slab, lastBill, tally:!!tc };
}
function northStars(from, to){
  const b = S.customers.flatMap(c => billsOf(c)).filter(x => x.g > 0 && x.date >= from && x.date < to);
  if (!b.length) return { n:0, w:0, r:0 };
  const w = b.reduce((s,x)=>s+x.g,0) / b.length;
  const r = b.reduce((s,x)=>s+(x.taxable || x.amt)/x.g,0) / b.length;
  return { n:b.length, w, r };
}

// ---------- modal ----------
function modal({ title, sub='', body, submit='Save', onSubmit, danger }){
  const wrap = document.createElement('div'); wrap.className='scrim';
  wrap.innerHTML = `<form class="modal"><h3>${esc(title)}</h3>${sub?`<p class="sub">${sub}</p>`:''}<div class="mb">${body}</div>
    <div class="err hidden"></div>
    <div class="foot"><button type="button" class="btn" data-x>Cancel</button>${onSubmit && submit!==null?`<button class="btn ${danger?'danger':'primary'}" type="submit">${esc(submit)}</button>`:''}</div></form>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form'), err = wrap.querySelector('.err');
  const close = () => wrap.remove();
  wrap.querySelector('[data-x]').onclick = close;
  wrap.addEventListener('mousedown', e => { if (e.target===wrap) close(); });
  form.onsubmit = async e => {
    e.preventDefault(); if (!onSubmit) return;
    const btns = [...form.querySelectorAll('[type=submit]:not([hidden])')]; btns.forEach(b => b.disabled = true); err.classList.add('hidden');
    const data = Object.fromEntries(new FormData(form).entries());
    data._submitter = e.submitter?.value;
    try { const keep = await onSubmit(data, form); if (keep !== true) close(); }
    catch(ex){ err.textContent = friendly(ex); err.classList.remove('hidden'); btns.forEach(b => b.disabled = false); }
  };
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
  return { form, close };
}
const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel?'selected':''}>${esc(label)}</option>`;
function staffOptions(need, selected, blank='— choose —'){
  const list = S.staff.filter(s => s.active && (s.roles.includes(need) || (need!=='accounts' && s.roles.includes('admin')) ));
  const sorted = list.sort((a,b) => (b.roles.includes(need)) - (a.roles.includes(need)) || a.name.localeCompare(b.name));
  return opt('', blank, !selected) + sorted.map(s => opt(s.id, s.name, s.id===selected)).join('');
}

// ---------- auth screens ----------
function phoneToEmail(p){ return String(p).replace(/\D/g,'').slice(-10) + '@staff.navkar.app'; }
async function callStaffAdmin(body){
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch(SB_URL + '/functions/v1/staff-admin', { method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer ' + (session?.access_token || SB_KEY) },
    body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({ error:'Server did not respond' }));
  if (!res.ok || j.error) throw new Error(j.error || 'Something went wrong');
  return j;
}
function renderLogin(needsSetup){
  $('#app').innerHTML = `<div class="auth"><div class="card">
    <h1>${COMPANY}</h1>
    ${needsSetup ? `<p class="sub">First time here. Create the admin login — this person can add everyone else.</p>
      <form id="f"><label>Your name</label><input name="name" required>
      <label>Phone number</label><input name="phone" inputmode="numeric" placeholder="10-digit mobile" required>
      <label>Choose a password</label><input name="password" type="password" minlength="6" required>
      <div class="err hidden"></div><p><button class="btn primary" style="width:100%">Create admin and sign in</button></p></form>`
    : `<p class="sub">Sign in with your phone number.</p>
      <form id="f"><label>Phone number</label><input name="phone" inputmode="numeric" placeholder="10-digit mobile" required autocomplete="username">
      <label>Password</label><input name="password" type="password" required autocomplete="current-password">
      <div class="err hidden"></div><p><button class="btn primary" style="width:100%">Sign in</button></p>
      <p class="muted" style="font-size:13px">Forgot your password? Ask your admin to reset it.</p></form>`}
  </div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); const err = e.target.querySelector('.err');
    const btn = e.target.querySelector('button'); btn.disabled = true; err.classList.add('hidden');
    try {
      if (needsSetup) await callStaffAdmin({ action:'create', name:d.name, phone:d.phone, password:d.password, roles:['admin'] });
      const { error } = await sb.auth.signInWithPassword({ email: phoneToEmail(d.phone), password: d.password });
      if (error) throw new Error(error.message.includes('Invalid') ? 'Phone number or password is wrong' : error.message);
      boot();
    } catch(ex){ err.textContent = friendly(ex); err.classList.remove('hidden'); btn.disabled = false; }
  };
}

}
function route(){
  const [page, id] = (location.hash.replace(/^#\/?/,'') || 'home').split('/');
  $('#nav').innerHTML = navItems().map(([k,l]) => `<a href="#/${k}" class="${(page===k || (page==='customer'&&k==='customers'))?'on':''}">${l}</a>`).join('');
  const v = $('#view');
  const views = { home:viewHome, dashboard:viewDashboard, tasks:viewTasks, orders:viewOrders, customers:viewCustomers, customer:viewCustomer, leads:viewLeads, staff:viewStaff, settings:viewSettings };
  (views[page] || viewHome)(v, id);
}
async function refresh(){ await loadAll(); route(); }
window.addEventListener('hashchange', () => S.me && route());

// ---------- HOME ----------

  <div class="tiles">
    <div class="card tile"><div class="n">${active.length}</div><div class="l">Orders in progress</div></div>
    <div class="card tile"><div class="n" style="color:${unassigned.length?'var(--bad)':'inherit'}">${unassigned.length}</div><div class="l">Orders waiting for someone to be allocated</div></div>
    <div class="card tile"><div class="n">${rupees(outstanding)}</div><div class="l">To collect</div></div>
    <div class="card tile"><div class="n" style="color:${overdue?'var(--bad)':'inherit'}">${rupees(overdue)}</div><div class="l">Overdue (past ${S.settings.credit_days} days)</div></div>
    <div class="card tile"><div class="n">${now.n?grams(now.w):'—'}</div><div class="l">Average weight per bill · last 90 days${now.n?delta(now.w,prev.w,grams):''}</div></div>
    <div class="card tile"><div class="n">${now.n?'₹'+now.r.toFixed(0)+'/g':'—'}</div><div class="l">Average rate per bill · last 90 days${now.n?delta(now.r,prev.r,x=>'₹'+x.toFixed(0)):''}</div></div>
  </div>
  ${unassigned.length && isAdmin() ? `<h2>Needs someone allocated</h2>${unassigned.slice(0,5).map(orderCard).join('')}${unassigned.length>5?`<a href="#/orders">See all ${unassigned.length}</a>`:''}`:''}
  <h2>Customer grades (last 90 days vs quarterly target)</h2>
  ${graded.length?`<div class="row" style="margin-bottom:10px">${['A','B','C','D'].map(g=>`<span class="pill g-${g}" style="font-size:13px;padding:4px 10px">${g}: ${graded.filter(x=>x.grade===g).length}</span>`).join('')}<span class="muted" style="font-size:13px">Top 20 by weight bought shown · <a href="#/customers">see all</a></span></div>`:''}
  ${graded.length ? `<div class="tablewrap"><table><tr><th>Customer</th><th>Size</th><th class="r">Bought</th><th class="r">Target</th><th class="r">Progress</th><th>Grade</th></tr>
    ${[...graded].sort((a,b)=>b.qGrams-a.qGrams).slice(0,20).map(x=>`<tr class="click" onclick="location.hash='#/customer/${x.c.id}'"><td class="b">${esc(x.c.name)}<div class="muted" style="font-size:13px">${esc(x.c.city||'')}</div></td><td>${SLAB_LABEL[x.slab]}</td><td class="r">${grams(x.qGrams)}</td><td class="r">${x.targetKg} kg</td><td class="r">${x.pct.toFixed(0)}%</td><td><span class="pill g-${x.grade}">${x.grade}</span></td></tr>`).join('')}
  </table></div>` : `<div class="card empty">Grades show up once customers have bills. Targets: single store ${S.settings.slab_targets['1']} kg, 2–10 stores ${S.settings.slab_targets['2-10']} kg, 11–25 stores ${S.settings.slab_targets['11-25']} kg, 25+ stores ${S.settings.slab_targets['26+']} kg a quarter.</div>`}

function syncBanner(){
  if (!isAdmin()) return '';
  const seen = S.tally?.lastSeen; if (!seen) return `<div class="card" style="border-color:#e8c98f;background:var(--warn-soft);margin-bottom:14px">Tally isn't connected yet. Bills, payments and balances will appear once the sync runs on the Tally computer.</div>`;
  const mins = Math.round((Date.now() - new Date(seen)) / 60000);
  if (mins <= 90) return '';
  const ago = mins < 60*24 ? `${Math.round(mins/60)} hours` : `${Math.round(mins/1440)} days`;
  return `<div class="card" style="border-color:#e8c98f;background:var(--warn-soft);margin-bottom:14px"><b>Tally sync isn't running.</b> Last update ${ago} ago. On the Tally computer: open Tally, then double-click <b>start_sync.bat</b>.</div>`;
}
// ---------- ORDER CARD ----------
function orderCard(o){
  const idx = stepIndex(o), cancelled = o.stage==='cancelled';
  const owner = stageOwner(o), mine = owner && owner===S.me.id;
  const steps = STEPS.map((s,i) => {
    const who = o[s.field], done = idx > i, now = idx === i;
    const cls = done ? 'done' : now ? 'now' + (who?'':' empty') : '';
    const tick = done ? '✓' : now ? '●' : '';
    const person = isAdmin() && !done && !cancelled
      ? `<select data-assign="${o.id}" data-role="${s.field}">${staffOptions(s.need, who, 'Not allocated')}</select>`
      : `<div class="p">${who ? esc(staffName(who)) : (done ? '—' : 'Not allocated')}</div>`;
    return `<div class="step ${cls}"><div class="t"><span>${i+1}. ${s.label}</span><span>${tick}</span></div>${person}</div>`;
  }).join('');
  const facts = [];
  if (o.estimate_g) facts.push(`Estimate ${esc(o.estimate_no||'')} · ${grams(o.estimate_g)} · ${rupees(o.estimate_amount)}`);
  if (o.checked_g!=null) facts.push(`Checked ${grams(o.checked_g)} ${o.check_ok?'✓ matches':'✗ did not match'}${o.check_note?' — '+esc(o.check_note):''}`);
  if (o.bill_amount) facts.push(`Bill ${esc(o.bill_no||'')} · ${grams(o.bill_g)} · ${rupees(o.bill_amount)} · due ${fmtDate(o.due_date)}`);
  if (o.shipment_note) facts.push(`Shipped: ${esc(o.shipment_note)}`);
  const pillCls = cancelled ? 'grey' : o.stage==='done' ? 'ok' : !owner ? 'bad' : '';
  const canAct = !cancelled && o.stage!=='done' && (mine || isAdmin()) && owner;
  return `<div class="order">
    <div class="top"><div><span class="no">${esc(o.order_no)}</span> · <a href="#/customer/${o.customer_id}">${esc(custName(o.customer_id))}</a>
      <span class="muted"> · ${fmtDate(o.order_date)}</span>${o.details?`<div class="muted" style="font-size:14px">${esc(o.details)}</div>`:''}</div>
      <div><span class="pill ${pillCls}">${STAGE_TEXT[o.stage]}${owner && !['done','cancelled'].includes(o.stage) ? ' · '+esc(staffName(owner)) : ''}</span></div></div>
    <div class="steps">${steps}</div>
    ${facts.length?`<div class="facts">${facts.join('<br>')}</div>`:''}
    ${(canAct || (isAdmin() && !cancelled && o.stage!=='done')) ? `<div class="act">
      ${canAct ? `<button class="btn ${mine?'primary':''} small" data-act="${o.id}">${actionLabel(o)}${!mine?' (as admin)':''}</button>`:''}
      ${isAdmin() && !cancelled && o.stage!=='done' ? `<button class="link" style="margin-left:auto;color:var(--muted);font-size:13px" data-cancel="${o.id}">Cancel order</button>`:''}
    </div>`:''}
  </div>`;
}
function actionLabel(o){
  return { received:'Mark as picked', picking:'Mark as picked', estimate:'Enter estimate', checking:'Check weights', billing:'Enter bill', shipping:'Mark packed & shipped' }[o.stage];
}
function bindOrderCards(root){
  root.querySelectorAll('[data-assign]').forEach(sel => sel.onchange = async () => {
    sel.disabled = true;
    const { error } = await sb.rpc('assign_order', { p_order: sel.dataset.assign, p_role: sel.dataset.role, p_staff: sel.value || null });
    if (error) { toast(friendly(error)); } else toast(sel.value ? `Allocated to ${staffName(sel.value)} — they'll get a WhatsApp` : 'Allocation removed');
    refresh();
  });
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => stageAction(S.orders.find(o => o.id===b.dataset.act)));
  root.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    const o = S.orders.find(x => x.id===b.dataset.cancel);
    modal({ title:`Cancel ${o.order_no}?`, body:`<p>This closes the order for ${esc(custName(o.customer_id))}. It can't be reopened.</p>`, submit:'Cancel order', danger:true,
      onSubmit: async () => { const { error } = await sb.rpc('cancel_order', { p_order:o.id }); if (error) throw error; toast('Order cancelled'); refresh(); } });
  });
}
async function runStage(o, p){ const { data, error } = await sb.rpc('complete_stage', { p_order:o.id, p }); if (error) throw error; return data; }
function stageAction(o){
  const c = custName(o.customer_id);
  const after = async next => { toast(next==='done' ? `${o.order_no} shipped` : `Done. Next: ${STAGE_TEXT[next].replace('Waiting ','').replace('for ','').replace('to be ','')}`); await refresh(); };
  if (['received','picking'].includes(o.stage)) return modal({ title:`Picked ${o.order_no}?`, sub:esc(c), body:`<p>Confirm all items for this order have been picked. It will go to accounts for the estimate.</p>`, submit:'Yes, picked',
    onSubmit: async () => after(await runStage(o, {})) });
  if (o.stage==='estimate') return modal({ title:`Estimate for ${o.order_no}`, sub:esc(c) + (o.check_ok===false?` · <b style="color:var(--bad)">Weight check failed${o.check_note?': '+esc(o.check_note):''} (checked ${grams(o.checked_g)})</b>`:''),
    body:`<label>Estimate number</label><input name="estimate_no" value="${esc(o.estimate_no||'')}" required>
      <div class="grid2"><div><label>Total weight (grams)</label><input name="estimate_g" type="number" step="0.001" min="0" value="${o.estimate_g??''}" required></div>
      <div><label>Amount (₹)</label><input name="estimate_amount" type="number" step="0.01" min="0" value="${o.estimate_amount??''}" required></div></div>`,
    submit:'Save and send for weight check', onSubmit: async d => after(await runStage(o, { estimate_no:d.estimate_no, estimate_g:d.estimate_g, estimate_amount:d.estimate_amount })) });
  if (o.stage==='checking') return modal({ title:`Weight check ${o.order_no}`, sub:`${esc(c)} · Estimate says <b>${grams(o.estimate_g)}</b>`,
    body:`<button type="submit" disabled hidden></button>
      <label>Weight on the scale (grams)</label><input name="checked_g" type="number" step="0.001" min="0" required>
      <label>Note (optional)</label><input name="note" placeholder="e.g. 2 pieces missing">
      <p class="muted" style="font-size:13px" id="diff"></p>
      <div class="row"><button class="btn ok" type="submit" value="ok">Matches — send for bill</button><button class="btn danger" type="submit" value="bad">Doesn't match — back to accounts</button></div>`,
    submit:null, onSubmit: async d => after(await runStage(o, { checked_g:d.checked_g, ok:d._submitter==='ok', note:d.note || null })) })
    && setTimeout(()=>{ const i = document.querySelector('[name=checked_g]'); i.oninput = () => { const diff = (Number(i.value)||0) - Number(o.estimate_g||0); document.getElementById('diff').textContent = i.value ? `Difference: ${diff>0?'+':''}${diff.toFixed(3)} g` : ''; }; });
  if (o.stage==='billing') return modal({ title:`Bill for ${o.order_no}`, sub:`${esc(c)} · Checked weight ${grams(o.checked_g)} · Estimate ${rupees(o.estimate_amount)}`,
    body:`<label>Bill number (as in Tally)</label><input name="bill_no" required>
      <div class="grid2"><div><label>Billed weight (grams)</label><input name="bill_g" type="number" step="0.001" min="0" value="${o.checked_g??o.estimate_g??''}" required></div>
      <div><label>Bill amount (₹)</label><input name="bill_amount" type="number" step="0.01" min="0" value="${o.estimate_amount??''}" required></div></div>
      <label>Bill date</label><input name="bill_date" type="date" value="${today()}" required>`,
    submit:'Save bill and send for packing', onSubmit: async d => after(await runStage(o, d)) });
  if (o.stage==='shipping') return modal({ title:`Pack & ship ${o.order_no}`, sub:esc(c),
    body:`<label>Shipping details (courier, tracking no., or hand delivery)</label><input name="note" required>`,
    submit:'Mark shipped', onSubmit: async d => after(await runStage(o, { note:d.note })) });
}

function newOrder(){

// ---------- TASK LIST ----------
let taskFilter = 'mine';
function viewTasks(v){
  const myOrders = S.orders.filter(o => !['done','cancelled'].includes(o.stage) && stageOwner(o)===S.me.id);
  const tasks = S.tasks.filter(t => taskFilter==='mine' ? t.assignee===S.me.id : taskFilter==='all' ? true : t.assignee===taskFilter);
  const open = tasks.filter(t => t.status==='open').sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));
  const done = tasks.filter(t => t.status==='done').sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||'')).slice(0,15);
  const taskRow = t => {
    const late = t.status==='open' && t.due_date && t.due_date < today();
    const link = t.customer_id ? ` · <a href="#/customer/${t.customer_id}">${esc(custName(t.customer_id))}</a>` : t.lead_id ? ` · lead: ${esc(S.leads.find(l=>l.id===t.lead_id)?.name||'')}` : '';
    return `<div class="list-item"><div><div class="b">${esc(t.title)}</div>
      <div class="muted" style="font-size:13px">${taskFilter!=='mine'?esc(staffName(t.assignee))+' · ':''}${t.due_date?`due ${fmtDate(t.due_date)}`:'no due date'}${link}${t.notes?' · '+esc(t.notes):''}</div>
      ${t.status==='done'?`<div class="muted" style="font-size:13px">Done ${fmtDate(t.done_at.slice(0,10))}${t.done_note?' — '+esc(t.done_note):''}</div>`:''}</div>
      <div class="row" style="flex-wrap:nowrap">${late?`<span class="pill bad">${daysBetween(t.due_date,today())}d late</span>`:''}
      ${t.status==='open' && (t.assignee===S.me.id || isAdmin()) ? `<button class="btn small ok" data-done="${t.id}">Done</button>`:''}
      ${isAdmin() ? `<button class="link" style="font-size:13px;color:var(--muted)" data-del="${t.id}">Delete</button>`:''}</div></div>`;
  };
  v.innerHTML = `<div class="row spread"><div><h1>Task list</h1><p class="sub">Everything waiting on ${taskFilter==='mine'?'you':'the team'}. Reminders go out on WhatsApp every morning at 10 until it’s done.</p></div>
    ${isAdmin()?`<button class="btn primary" id="newtask">+ Give someone a task</button>`:''}</div>
    ${isAdmin()?`<div class="tabs"><button data-f="mine" class="${taskFilter==='mine'?'on':''}">Mine</button><button data-f="all" class="${taskFilter==='all'?'on':''}">Everyone</button>
      <select id="per" style="width:auto;border-radius:99px;padding:5px 10px">${opt('', 'By person…')}${S.staff.filter(s=>s.active).map(s=>opt(s.id,s.name,taskFilter===s.id)).join('')}</select></div>`:''}
    ${taskFilter==='mine' ? `<h2>Order steps for you (${myOrders.length})</h2>${myOrders.length ? myOrders.map(orderCard).join('') : `<div class="card empty">No orders waiting on you.</div>`}`:''}
    <h2>Tasks (${open.length})</h2>
    <div class="card">${open.length ? open.map(taskRow).join('') : `<div class="empty">No open tasks.</div>`}</div>
    ${done.length?`<h2>Recently done</h2><div class="card">${done.map(taskRow).join('')}</div>`:''}`;
  bindOrderCards(v);
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { taskFilter = b.dataset.f; route(); });
  if ($('#per')) $('#per').onchange = e => { if (e.target.value) { taskFilter = e.target.value; route(); } };
  if ($('#newtask')) $('#newtask').onclick = () => newTask();
  v.querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
    const t = S.tasks.find(x => x.id===b.dataset.done);
    modal({ title:'Mark done', sub:esc(t.title), body:`<label>Note (optional)</label><input name="note" placeholder="What happened?">`, submit:'Done',
      onSubmit: async d => { const { error } = await sb.rpc('complete_task', { p_task:t.id, p_note:d.note||null }); if (error) throw error; toast('Task done'); refresh(); } });
  });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this task?')) return;
    const { error } = await sb.from('tasks').delete().eq('id', b.dataset.del); if (error) toast(friendly(error)); refresh();
  });
}
function newTask(pre = {}){

      <div class="grid2"><div><label>Who</label><select name="assignee" required>${opt('','— choose —')}${S.staff.filter(s=>s.active).map(s=>opt(s.id,s.name)).join('')}</select></div>

// ---------- CUSTOMERS ----------
let custSearch = '', custSort = 'overdue', custSlab = 'all', custType = 'all';
function viewCustomers(v){

function viewCustomer(v, id){

    ...(t?.returns||[]).map(r => ({ date:r.date, kind:'pay', text:`Goods returned · ${r.voucher_number||''}${r.weight_g?' · '+grams(r.weight_g):''}`, sub:'Tally credit note', amt:-Number(r.amount||0) })),

  ${ledger.length?`<div class="tablewrap"><table><tr><th>Date</th><th>What</th><th class="r">Billed</th><th class="r">Paid</th><th class="r">Balance</th>${canPay?'<th></th>':''}</tr>
    ${ledger.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${esc(l.text)}<div class="muted" style="font-size:13px">${esc(l.sub)}</div></td>

  </table></div>`:`<div class="card empty">No bills or payments yet.</div>`}

  if (!items.length) return '<div class="empty">No data</div>';
  const W = Math.max(320, items.length * 64), max = Math.max(...items.map(i => i.value), 1), bw = Math.min(46, (W - 20) / items.length - 12);
  const bars = items.map((it, i) => { const x = 10 + i * ((W - 20) / items.length) + (((W - 20) / items.length) - bw) / 2; const bh = (it.value / max) * (h - 60); const y = h - 30 - bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${it.color || color}"><title>${esc(it.label)}: ${esc(fmt(it.value))}</title></rect>
      <text x="${x + bw/2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="#333">${esc(fmt(it.value))}</text>
      <text x="${x + bw/2}" y="${h - 12}" text-anchor="middle" font-size="11" fill="#6b6b70">${esc(it.label)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;max-height:${h + 20}px">${bars}</svg>`;
}
function svgHBars(items, { fmt = v => v, color = '#3a4a5c' } = {}){
  if (!items.length) return '<div class="empty">No data</div>';
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div>${items.map(it => `<div style="display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px">
    <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(it.label)}">${it.href?`<a href="${it.href}">${esc(it.label)}</a>`:esc(it.label)}</div>
    <div style="background:#f0efec;border-radius:4px;height:14px"><div style="width:${Math.max(1,it.value/max*100)}%;height:14px;border-radius:4px;background:${it.color||color}"></div></div>
    <div class="b" style="min-width:70px;text-align:right">${esc(fmt(it.value))}</div></div>`).join('')}</div>`;
}
function svgStack(rows, keys, colors){
  // rows [{label, parts:{k:v}}] -> 100% stacked horizontal bars
  return rows.map(r => { const tot = keys.reduce((s,k)=>s+(r.parts[k]||0),0) || 1;
    return `<div style="display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin:8px 0;font-size:13px"><div>${esc(r.label)}</div>
      <div style="display:flex;height:18px;border-radius:4px;overflow:hidden;background:#f0efec">${keys.map((k,i)=>r.parts[k]?`<div title="${esc(k)}: ${r.parts[k]}" style="width:${r.parts[k]/tot*100}%;background:${colors[i]};color:#fff;font-size:11px;text-align:center;line-height:18px">${r.parts[k]/tot>0.08?r.parts[k]:''}</div>`:'').join('')}</div>
      <div class="muted">${keys.reduce((s,k)=>s+(r.parts[k]||0),0)}</div></div>`; }).join('') +
    `<div class="row" style="font-size:12px;margin-top:6px">${keys.map((k,i)=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${colors[i]}"></span> ${esc(k)}</span>`).join('')}</div>`;
}
const lakh = n => { n = Number(n)||0; return n >= 1e7 ? '₹' + (n/1e7).toFixed(2) + ' Cr' : '₹' + (n/1e5).toFixed(1) + ' L'; };
function agingOf(c, x){
  // spread what's owed across the newest bills; age each part by its bill date
  const b = { 'Not due':0, '46–90 days':0, '91–180 days':0, '180+ days':0 };
  let left = x.outstanding; const cd = creditDays(c);
  for (const bill of [...x.bills].reverse()) { if (left <= 0.5) break; const part = Math.min(left, bill.amt); left -= part;
    const age = daysBetween(bill.date, today()); b[age <= cd ? 'Not due' : age <= 90 ? '46–90 days' : age <= 180 ? '91–180 days' : '180+ days'] += part; }
  if (left > 0.5) b['180+ days'] += left; // older than this year's bills
  return b;
}
function viewDashboard(v){
  const from = dashPeriod === 'fy' ? '2026-04-01' : daysAgo(dashPeriod === '90' ? 90 : 30);
  const states = [...new Set(S.customers.map(c => c.state).filter(Boolean))].sort();
  const all = S.customers.map(c => { const x = customerStats(c); const inP = x.bills.filter(b => (b.date||'') >= from);
    const t = c.tally_name && S.tally.by[c.tally_name]; const ret = (t?.returns||[]).filter(r => r.date >= from);
    return { c, x, slab: x.slab, type: c.account_type || 'Not classified', bills: inP,
      amt: inP.reduce((s,b)=>s+b.amt,0) - ret.reduce((s,r)=>s+Number(r.amount||0),0),
      g: inP.reduce((s,b)=>s+b.g,0) - ret.reduce((s,r)=>s+Number(r.weight_g||0),0), taxable: inP.reduce((s,b)=>s+(b.taxable||0),0) }; })
    .filter(r => (dashSlab==='all'||r.slab===dashSlab) && (dashState==='all'||r.c.state===dashState) && (dashType==='all'||r.type===dashType));
  const buyers = all.filter(r => r.bills.length);
  const sales = all.reduce((s,r)=>s+r.amt,0), kg = all.reduce((s,r)=>s+r.g,0)/1000, nb = all.reduce((s,r)=>s+r.bills.length,0);
  const gBills = all.flatMap(r => r.bills).filter(b => b.g > 0);
  const avgW = gBills.length ? gBills.reduce((s,b)=>s+b.g,0)/gBills.length : 0;
  const avgR = gBills.length ? gBills.reduce((s,b)=>s+(b.taxable||b.amt)/b.g,0)/gBills.length : 0;
  const owed = all.reduce((s,r)=>s+r.x.outstanding,0), od = all.reduce((s,r)=>s+r.x.overdue,0);
  // monthly
  const months = []; for (let d = new Date(from + 'T00:00:00'); d <= new Date(); d.setMonth(d.getMonth()+1)) { const k = d.toISOString().slice(0,7); if (!months.includes(k)) months.push(k); }
  const mKg = Object.fromEntries(months.map(m=>[m,0])), mAmt = Object.fromEntries(months.map(m=>[m,0]));
  all.forEach(r => r.bills.forEach(b => { const m = (b.date||'').slice(0,7); if (m in mKg) { mKg[m] += b.g/1000; mAmt[m] += b.amt; } }));
  const mLabel = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-IN',{month:'short'});
  // slabs
  const bySlab = SLABS.map(s => { const rs = all.filter(r => r.slab === s); return { s, n: rs.length, buyers: rs.filter(r=>r.bills.length).length, amt: rs.reduce((t,r)=>t+r.amt,0), kg: rs.reduce((t,r)=>t+r.g,0)/1000,
    grades: Object.fromEntries(['A','B','C','D','—'].map(g => [g, rs.filter(r => r.x.grade === g).length])) }; });
  const byType = [...TYPES, 'Not classified'].map((t,i) => ({ label: t, value: all.filter(r => r.type === t).reduce((s,r)=>s+r.amt,0), color: PAL[i % PAL.length] })).filter(i => i.value > 0).sort((a,b)=>b.value-a.value);
  const byState = Object.entries(all.reduce((m,r)=>{ const k = r.c.state || 'Unknown'; m[k] = (m[k]||0) + r.amt; return m; }, {})).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([label,value]) => ({ label, value }));
  const top = [...all].sort((a,b)=>b.g-a.g).slice(0,15).map(r => ({ label: r.c.name, value: r.g/1000, href:'#/customer/'+r.c.id, color: {A:'#2f7d4f',B:'#3a4a5c',C:'#b8862c',D:'#b23b3b'}[r.x.grade] || '#a3a3a3' }));
  const aging = all.reduce((m,r) => { const a = agingOf(r.c, r.x); for (const k in a) m[k] = (m[k]||0) + a[k]; return m; }, {});
  const gap = all.filter(r => r.x.grade === 'D' || r.x.grade === 'C').sort((a,b) => (b.x.targetKg - b.x.qGrams/1000) - (a.x.targetKg - a.x.qGrams/1000)).slice(0,10);
  const classified = S.customers.filter(c => c.account_type).length;
  const sel = (id, cur, opts) => `<select id="${id}" style="width:auto">${opts.map(([k,l])=>opt(k,l,cur===k)).join('')}</select>`;
  v.innerHTML = `<div class="row spread"><div><h1>Dashboard</h1><p class="sub">${tallyUpto()?`Tally data up to ${fmtDate(tallyUpto())} · `:''}${classified} of ${S.customers.length} customers classified by store count</p></div>
    <div class="row">${sel('dp',dashPeriod,[['fy','This financial year'],['90','Last 90 days'],['30','Last 30 days']])}
      ${sel('ds',dashSlab,[['all','All sizes'],...SLABS.map(s=>[s,SLAB_LABEL[s]])])}
      ${sel('dt',dashType,[['all','All business types'],...TYPES.map(t=>[t,t]),['Not classified','Not classified']])}
      ${sel('dst',dashState,[['all','All states'],...states.map(s=>[s,s])])}</div></div>
  <div class="tiles">
    <div class="card tile"><div class="n">${lakh(sales)}</div><div class="l">Sales (incl. GST, less returns)</div></div>
    <div class="card tile"><div class="n">${kg.toLocaleString('en-IN',{maximumFractionDigits:0})} kg</div><div class="l">Silver sold</div></div>
    <div class="card tile"><div class="n">${nb}</div><div class="l">Bills · ${buyers.length} buying customers</div></div>
    <div class="card tile"><div class="n">${grams(avgW)}</div><div class="l">Average weight per bill</div></div>
    <div class="card tile"><div class="n">₹${avgR.toFixed(0)}/g</div><div class="l">Average rate per bill (before GST)</div></div>
    <div class="card tile"><div class="n" style="color:${od?'var(--bad)':'inherit'}">${lakh(od)}</div><div class="l">Overdue, of ${lakh(owed)} to collect</div></div>
  </div>
  <div class="grid2" style="gap:14px;margin-top:14px">
    <div class="card"><h2 style="margin-top:0">Silver sold by month (kg)</h2>${svgBars(months.map(m=>({label:mLabel(m), value:Math.round(mKg[m])})), { fmt: v => v.toLocaleString('en-IN') })}</div>
    <div class="card"><h2 style="margin-top:0">Sales by month</h2>${svgBars(months.map(m=>({label:mLabel(m), value:mAmt[m]})), { fmt: lakh, color:'#7d93ab' })}</div>
    <div class="card"><h2 style="margin-top:0">By store count</h2>
      <table><tr><th>Size</th><th class="r">Customers</th><th class="r">Buying</th><th class="r">Silver (kg)</th><th class="r">Sales</th><th class="r">Share</th></tr>
      ${bySlab.map(r=>`<tr><td>${SLAB_LABEL[r.s]}</td><td class="r">${r.n}</td><td class="r">${r.buyers}</td><td class="r">${r.kg.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td class="r">${lakh(r.amt)}</td><td class="r">${sales?(r.amt/sales*100).toFixed(0):0}%</td></tr>`).join('')}</table></div>
    <div class="card"><h2 style="margin-top:0">Grades by store count</h2><p class="muted" style="font-size:13px;margin-top:-6px">Last 90 days against each size's quarterly target</p>
      ${svgStack(bySlab.map(r=>({label:SLAB_LABEL[r.s], parts:{A:r.grades.A,B:r.grades.B,C:r.grades.C,D:r.grades.D,'No bills':r.grades['—']}})), ['A','B','C','D','No bills'], ['#2f7d4f','#3a4a5c','#b8862c','#b23b3b','#c9c6bf'])}</div>
    <div class="card"><h2 style="margin-top:0">Top 15 customers by silver bought (kg)</h2>${svgHBars(top, { fmt: v => v.toLocaleString('en-IN',{maximumFractionDigits:1}) })}<p class="muted" style="font-size:12px">Bar colour = grade (green A, slate B, amber C, red D)</p></div>
    <div class="card"><h2 style="margin-top:0">Money owed, by age</h2>${svgBars(Object.entries(aging).map(([label,value],i)=>({label, value, color:['#2f7d4f','#b8862c','#d0702b','#b23b3b'][i]})), { fmt: lakh })}<p class="muted" style="font-size:12px">Estimate: assumes payments clear the oldest bills first.</p></div>
    <div class="card"><h2 style="margin-top:0">Sales by business type</h2>${svgHBars(byType, { fmt: lakh })}</div>
    <div class="card"><h2 style="margin-top:0">Sales by state (top 10)</h2>${svgHBars(byState, { fmt: lakh, color:'#7d93ab' })}</div>
  </div>
  <h2>Furthest behind target (grade C and D)</h2>
  ${gap.length?`<div class="tablewrap"><table><tr><th>Customer</th><th>Size</th><th>Type</th><th class="r">Bought, 90 days</th><th class="r">Target</th><th class="r">Short by</th><th>Grade</th></tr>
    ${gap.map(r=>`<tr class="click" onclick="location.hash='#/customer/${r.c.id}'"><td class="b">${esc(r.c.name)}</td><td>${SLAB_LABEL[r.slab]}</td><td>${esc(r.type)}</td><td class="r">${grams(r.x.qGrams)}</td><td class="r">${r.x.targetKg} kg</td><td class="r">${(r.x.targetKg - r.x.qGrams/1000).toFixed(1)} kg</td><td><span class="pill g-${r.x.grade}">${r.x.grade}</span></td></tr>`).join('')}</table></div>`:'<div class="card empty">Nobody is behind target.</div>'}`;
  $('#dp').onchange = e => { dashPeriod = e.target.value; route(); };
  $('#ds').onchange = e => { dashSlab = e.target.value; route(); };
  $('#dt').onchange = e => { dashType = e.target.value; route(); };
  $('#dst').onchange = e => { dashState = e.target.value; route(); };
}

// ---------- STAFF ----------
function viewStaff(v){
  if (!isAdmin()) return viewHome(v);
  const roleChips = s => s.roles.map(r => `<span class="pill ${r==='admin'?'':'grey'}">${ROLE_NAMES[r]||r}</span>`).join(' ');
  v.innerHTML = `<div class="row spread"><div><h1>Staff</h1><p class="sub">Who can sign in, and what work they can be given. Estimates and bills only go to Accounts.</p></div>
    <button class="btn primary" id="add">+ Add staff</button></div>
    <div class="tablewrap"><table><tr><th>Name</th><th>Phone (login)</th><th>Roles</th><th>Open work</th><th></th></tr>
    ${S.staff.map(s=>{ const ow = S.orders.filter(o=>!['done','cancelled'].includes(o.stage) && stageOwner(o)===s.id).length + S.tasks.filter(t=>t.status==='open'&&t.assignee===s.id).length;
      return `<tr style="${s.active?'':'opacity:.5'}"><td class="b">${esc(s.name)}${s.active?'':' (inactive)'}</td><td>${esc(String(s.phone).slice(-10))}</td><td>${roleChips(s)}</td><td>${ow||'—'}</td>
      <td class="r"><button class="link" data-ed="${s.id}">Edit</button> · <button class="link" data-pw="${s.id}">Reset password</button></td></tr>`; }).join('')}
    </table></div>
    <h2>WhatsApp notifications</h2>
    <div class="card"><p style="margin:0">${S.outboxCount} message${S.outboxCount===1?'':'s'} queued. <span class="muted">Staff get a message when work is allocated to them, when it becomes their turn on an order, and a reminder every morning at 10 for anything still pending. Admins get a daily summary and a message when a task is completed. Sending switches on once the WhatsApp Business number is connected.</span></p></div>`;
  const roleBoxes = (sel=[]) => Object.entries(ROLE_NAMES).map(([k,l]) => `<label class="chk"><input type="checkbox" name="role_${k}" ${sel.includes(k)?'checked':''}> ${l}</label>`).join('');
  const pickRoles = d => Object.keys(ROLE_NAMES).filter(k => d['role_'+k]);
  $('#add').onclick = () => modal({ title:'Add staff', sub:'They sign in with this phone number and password. Share it with them directly.',
    body:`<label>Name</label><input name="name" required><div class="grid2"><div><label>Phone</label><input name="phone" inputmode="numeric" required placeholder="10-digit mobile"></div>
      <div><label>Starting password</label><input name="password" minlength="6" required></div></div><label>What do they do?</label>${roleBoxes()}`,
    submit:'Add', onSubmit: async d => { await callStaffAdmin({ action:'create', name:d.name, phone:d.phone, password:d.password, roles:pickRoles(d) }); toast(`${d.name} added`); refresh(); } });
  v.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const s = S.staff.find(x => x.id===b.dataset.ed);
    modal({ title:`Edit ${s.name}`, body:`<label>Name</label><input name="name" value="${esc(s.name)}" required><label>Roles</label>${roleBoxes(s.roles)}
      <label class="chk" style="margin-top:12px"><input type="checkbox" name="active" ${s.active?'checked':''}> Can sign in (active)</label>`,
      onSubmit: async d => { const roles = pickRoles(d);
        if (s.id===S.me.id && !roles.includes('admin')) throw new Error("You can't remove your own admin role");
        const { error } = await sb.from('staff').update({ name:d.name, roles, active:!!d.active }).eq('id', s.id); if (error) throw error; toast('Saved'); refresh(); } }); });
  v.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => { const s = S.staff.find(x => x.id===b.dataset.pw);
    modal({ title:`New password for ${s.name}`, body:`<label>Password</label><input name="password" minlength="6" required>`,
      onSubmit: async d => { await callStaffAdmin({ action:'set_password', id:s.id, password:d.password }); toast('Password changed'); } }); });
}

// ---------- SETTINGS ----------
function viewSettings(v){
  if (!isAdmin()) return viewHome(v);
  const t = S.settings.slab_targets, g = S.settings.grade_cuts;
  v.innerHTML = `<h1>Settings</h1><p class="sub">Targets and rules used for grading and collections.</p>
  <form class="card" id="f" style="max-width:560px">
    <h2 style="margin-top:0">Quarterly targets (kg)</h2>
    <div class="grid2"><div><label>Single store</label><input name="t1" type="number" step="0.1" value="${t['1']}"></div>
    <div><label>2–10 stores</label><input name="t2" type="number" step="0.1" value="${t['2-10']}"></div>
    <div><label>11–25 stores</label><input name="t3" type="number" step="0.1" value="${t['11-25']}"></div>
    <div><label>25+ stores</label><input name="t4" type="number" step="0.1" value="${t['26+']}"></div></div>
    <h2>Grades (% of target reached)</h2>
    <div class="grid2"><div><label>A at or above</label><input name="gA" type="number" value="${g.A}"></div>
    <div><label>B at or above</label><input name="gB" type="number" value="${g.B}"></div>
    <div><label>C at or above</label><input name="gC" type="number" value="${g.C}"></div><div><label>&nbsp;</label><p class="muted" style="margin:8px 0">Below C is D.</p></div></div>
    <h2>Collections</h2>
    <label>Standard credit days</label><input name="cd" type="number" min="0" value="${S.settings.credit_days}">
    <p><button class="btn primary">Save settings</button></p></form>
  <div class="card" style="max-width:560px;margin-top:16px"><h2 style="margin-top:0">Import customer research</h2>
    <p class="muted" style="font-size:14px">Upload the store-count research file (JSON). It fills in each customer's number of stores, business type and city, and adds the source to their notes. Store counts someone already changed by hand are kept.</p>
    <input type="file" id="research" accept=".json,application/json" aria-label="customer research file"><p id="rmsg" class="muted" style="font-size:14px"></p></div>`;
  $('#research').onchange = async e => {
    const msg = $('#rmsg'); const f = e.target.files[0]; if (!f) return;
    try {
      const list = JSON.parse(await f.text()); const byName = new Map(S.customers.map(c => [c.tally_name || c.name, c]));
      let done = 0, skipped = 0, missing = 0;
      for (const r of list) {
        const c = byName.get(r.name); if (!c) { missing++; continue; }
        const manual = (c.notes||'').includes('[stores set by hand]');
        const tag = `Store count ${r.stores} (${r.confidence})${r.note?': '+r.note:''}${r.source?' · '+r.source:''}`;
        const notes = [ (c.notes||'').split('\n').filter(l => !l.startsWith('Store count ')).join('\n').trim(), tag ].filter(Boolean).join('\n');
        const upd = { account_type: r.business_type || c.account_type || null, notes };
        if (!manual) upd.stores = Math.max(1, Number(r.stores)||1);
        if (!c.city && r.city) upd.city = r.city;
        const { error } = await sb.from('customers').update(upd).eq('id', c.id);
        if (error) { skipped++; } else done++;
        if (done % 25 === 0) msg.textContent = `Updating… ${done} of ${list.length}`;
      }
      msg.textContent = `Done. ${done} customers updated${skipped?`, ${skipped} failed`:''}${missing?`, ${missing} not found in the CRM`:''}.`;
      await loadAll();
    } catch (ex) { msg.textContent = 'Could not read that file: ' + friendly(ex); }
  };
  $('#f').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    const { error } = await sb.from('settings').update({
      slab_targets:{ '1':+d.t1, '2-10':+d.t2, '11-25':+d.t3, '26+':+d.t4 }, grade_cuts:{ A:+d.gA, B:+d.gB, C:+d.gC }, credit_days:+d.cd }).eq('id', 1);
    if (error) return toast(friendly(error)); toast('Settings saved'); refresh(); };
}

// ---------- boot ----------
async function boot(){
  $('#app').innerHTML = `<div class="auth"><p class="muted">Loading…</p></div>`;
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) {
    let needsSetup = false; try { needsSetup = (await callStaffAdmin({ action:'status' })).needsSetup; } catch(e){}
    return renderLogin(needsSetup);
  }
  S.uid = session.user.id;
  try { await loadAll(); } catch(e){ $('#app').innerHTML = `<div class="auth"><div class="card"><p>Couldn't load: ${esc(friendly(e))}</p><button class="btn" onclick="sb.auth.signOut().then(boot)">Sign out</button></div></div>`; return; }
  if (!S.me || !S.me.active) { await sb.auth.signOut(); $('#app').innerHTML = `<div class="auth"><div class="card"><p>This login isn't active. Ask your admin.</p><button class="btn" onclick="boot()">Back</button></div></div>`; return; }
  shell();
  if (!location.hash) location.hash = isAdmin() ? '#/home' : '#/tasks';
  route();
}
boot();
</script>
